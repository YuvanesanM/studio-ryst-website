<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-G00HG2N31H"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-G00HG2N31H');

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Feedback · Studio RYST</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f4f1; --panel:#ffffff; --panel2:#f7f8f5;
    --line:#e3e5e0; --accent:#3d9b69; --accent-d:#2f7d54; --accent-soft:#eaf4ee;
    --ink:#1d211c; --muted:#5f655d; --muted2:#9aa097; --danger:#c0584b;
    --star:#e8ac2e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:520px;margin:0 auto;padding:32px 18px 60px}
  .brand{text-align:center;margin-bottom:22px}
  .brand h1{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;font-size:30px}
  .brand small{display:block;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted2);margin-top:4px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 22px;box-shadow:0 10px 30px rgba(40,50,40,.06);text-align:center}
  .card p.lead{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.6}
  .stars{display:flex;justify-content:center;gap:8px;margin-bottom:22px}
  .star{font-size:38px;line-height:1;background:none;border:none;color:var(--line);transition:.15s;padding:2px}
  .star.on{color:var(--star)}
  .star:hover{transform:scale(1.1)}
  textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:12px 13px;font-size:14px;font-family:inherit;color:var(--ink);resize:vertical;min-height:90px;margin-bottom:18px}
  textarea:focus{outline:none;border-color:var(--accent)}
  .submit-btn{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px 30px;font-size:14.5px;font-weight:700;width:100%}
  .submit-btn:hover{background:var(--accent-d)}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed}
  .err{color:var(--danger);font-size:12.5px;margin-top:10px;min-height:16px}
  .thanks h2{font-size:20px;font-weight:700;margin-bottom:8px}
  .thanks p{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:20px}
  .review-box{background:var(--accent-soft);border-radius:12px;padding:18px;margin-top:8px}
  .review-box .stars-static{font-size:22px;color:var(--star);margin-bottom:10px}
  .paste-box{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:12px 13px;font-size:12.5px;color:var(--muted);text-align:left;white-space:pre-wrap;margin:14px 0}
  .rbtns{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .rbtn{border:none;border-radius:11px;padding:13px 20px;font-size:13.5px;font-weight:700}
  .rbtn.primary{background:var(--accent);color:#fff}
  .rbtn.primary:hover{background:var(--accent-d)}
  .rbtn.ghost{background:var(--panel);border:1.5px solid var(--line);color:var(--ink)}
  .rbtn.ghost:hover{border-color:var(--accent);color:var(--accent-d)}
  .loading,.notfound{text-align:center;color:var(--muted2);font-size:13.5px;padding:60px 10px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;font-size:12.5px;opacity:0;transition:.25s;z-index:20}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><h1>Studio RYST</h1><small>We'd love your feedback</small></div>
  <div class="card" id="card"><div class="loading">Loading…</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const PROXY_URL = 'https://ryst-109a-proxy.onrender.com/studio';
const token = new URLSearchParams(location.search).get('t') || '';
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.className='toast show'; clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',2600); }

let rating=0, GOOGLE_URL='', CNAME='';

function renderForm(alreadySubmitted){
  $('#card').innerHTML = `
    <p class="lead">${CNAME?`Hi ${esc(CNAME)}, thank`:'Thank'} you for choosing Studio RYST! How was your experience?</p>
    <div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<button type="button" class="star" data-n="${n}">★</button>`).join('')}</div>
    <textarea id="comment" placeholder="Tell us a bit more (optional)…"></textarea>
    <button class="submit-btn" id="submitBtn" disabled>Submit feedback</button>
    <div class="err" id="err"></div>`;
  $('#stars').addEventListener('click', e=>{
    const btn=e.target.closest('.star'); if(!btn) return;
    rating=+btn.dataset.n;
    $$stars().forEach(s=>s.classList.toggle('on', +s.dataset.n<=rating));
    $('#submitBtn').disabled=false;
  });
  $('#submitBtn').addEventListener('click', submit);
  if(alreadySubmitted){ toast('You already sent feedback — feel free to update it.'); }
}
function $$stars(){ return [...document.querySelectorAll('.star')]; }

async function submit(){
  const btn=$('#submitBtn'); btn.disabled=true; btn.textContent='Submitting…';
  $('#err').textContent='';
  try{
    const res=await fetch(PROXY_URL+'/feedback',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token, rating, comment:$('#comment').value.trim()})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok){ $('#err').textContent=data.error||'Could not submit — please try again.'; btn.disabled=false; btn.textContent='Submit feedback'; return; }
    GOOGLE_URL=data.googleReviewUrl||GOOGLE_URL;
    renderThanks(rating, $('#comment').value.trim());
  }catch(e){ $('#err').textContent='Network error — please try again.'; btn.disabled=false; btn.textContent='Submit feedback'; }
}

// A high rating (>4, i.e. 5★) is a client who's happy enough to ask for a
// public Google review — with their own comment ready to paste, since
// retyping it is the biggest reason people never actually leave one. A
// lower rating stays private so the studio can follow up directly instead
// of risking a public complaint.
function renderThanks(r, comment){
  const stars='★'.repeat(r)+'☆'.repeat(5-r);
  if(r>4 && GOOGLE_URL){
    $('#card').innerHTML=`
      <div class="thanks">
        <h2>Thank you! 🎉</h2>
        <p>So glad you had a great experience. Would you mind sharing it publicly? It really helps the studio.</p>
        <div class="review-box">
          <div class="stars-static">${stars}</div>
          ${comment?`<div class="paste-box" id="pasteBox">${esc(comment)}</div>`:''}
          <div class="rbtns">
            ${comment?`<button class="rbtn ghost" id="copyBtn">📋 Copy my feedback</button>`:''}
            <a class="rbtn primary" href="${esc(GOOGLE_URL)}" target="_blank" style="display:block;text-align:center;text-decoration:none">⭐ Leave a Google review →</a>
          </div>
        </div>
      </div>`;
    const copyBtn=$('#copyBtn');
    if(copyBtn) copyBtn.addEventListener('click', async ()=>{
      try{ await navigator.clipboard.writeText(comment); toast('Copied! Paste it into your Google review.'); }
      catch(e){ toast('Could not copy — select the text above manually.'); }
    });
  } else {
    $('#card').innerHTML=`
      <div class="thanks">
        <h2>Thank you 🙏</h2>
        <p>We appreciate you taking the time to share this — the team will follow up if needed.</p>
        <div class="stars-static" style="color:var(--star);font-size:22px">${stars}</div>
      </div>`;
  }
}

(async function init(){
  if(!token){ $('#card').innerHTML='<div class="notfound">This feedback link looks incomplete.</div>'; return; }
  try{
    const res=await fetch(PROXY_URL+'/feedback?token='+encodeURIComponent(token));
    if(res.status===404){ $('#card').innerHTML='<div class="notfound">We couldn\'t find this booking.</div>'; return; }
    if(!res.ok) throw new Error();
    const d=await res.json();
    CNAME=d.cname||''; GOOGLE_URL=d.googleReviewUrl||'';
    if(d.feedback && d.feedback.rating){
      renderThanks(d.feedback.rating, d.feedback.comment||'');
    } else {
      renderForm(false);
    }
  }catch(e){ $('#card').innerHTML='<div class="notfound">Could not load — please try the link again in a moment.</div>'; }
})();
</script>
</body>
</html>
